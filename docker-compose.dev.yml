name: perplexity-dev

services:
  valkey:
    image: valkey/valkey:9.0.3-alpine
    container_name: perplexity_dev_valkey
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_dev_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  redis-insight:
    image: redis/redisinsight:2.70
    container_name: perplexity_dev_redis_insight
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "${REDIS_INSIGHT_PORT:-5540}:5540"
    volumes:
      - redis_insight_data:/data
    networks:
      - app_network

  mongodb:
    image: mongo:7.0
    container_name: perplexity_dev_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_dev_data:/data/db
      - mongo_dev_config:/data/configdb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'db.adminCommand({ ping: 1 }).ok' | mongosh mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@127.0.0.1:27017/admin --quiet | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: perplexity_dev_backend
    restart: unless-stopped
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_MAX_RETRIES: ${DB_MAX_RETRIES:-10}
      DB_RETRY_DELAY_MS: ${DB_RETRY_DELAY_MS:-5000}
      DB_SERVER_SELECTION_TIMEOUT_MS: ${DB_SERVER_SELECTION_TIMEOUT_MS:-5000}
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-password}@mongodb:27017/${MONGO_DATABASE:-perplexity}?authSource=admin
      VALKEY_URL: redis://valkey:6379
      VALKEY_ENABLED: ${VALKEY_ENABLED:-true}
      VALKEY_TTL_SECONDS: ${VALKEY_TTL_SECONDS:-3600}
      CHAT_HISTORY_LIMIT: ${CHAT_HISTORY_LIMIT:-20}
    depends_on:
      valkey:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: perplexity_dev_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: ${DEV_VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  valkey_dev_data:
  redis_insight_data:
  mongo_dev_data:
  mongo_dev_config:
  backend_node_modules:
  frontend_node_modules:
